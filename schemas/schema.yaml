---
ise: include('ise', required=False)
defaults: any(required=False)
---
ise:
  system: include('system', required=False)
  network_resources: include('network_resources', required=False)
  identity_management: include('identity_management', required=False)
  trust_sec: include('trust_sec', required=False)
  network_access: include('network_access', required=False)
  device_administration: include('device_administration', required=False)

system:
  repositories: list(include('sys_repositories'), required=False)
  licenses: list(include('sys_licenses'), required=False)

sys_repositories:
  name: str()
  protocol: enum('CDROM', 'DISK', 'FTP', 'HTTP', 'HTTPS', 'NFS', 'SFTP', 'TFTP')
  path: str()
  server_name: str(required=False)
  user_name: str(required=False)
  password: str(required=False)
  enable_pki: bool(required=False)

sys_licenses:
  name: enum('ESSENTIAL', 'ADVANTAGE', 'PREMIER', 'DEVICEADMIN', 'VM')
  status: enum('ENABLED', 'DISABLED', required=False)

network_resources:
  network_device_groups: list(include('nr_network_device_groups'), required=False)
  network_devices: list(include('nr_network_devices'), required=False)

nr_network_device_groups:
  name: str()
  description: str(required=False)
  path: str(required=False)
  children: list(include('nr_network_device_groups_children'), required=False)

nr_network_device_groups_children:
  name: str()
  description: str(required=False)
  children: list(include('nr_network_device_groups_children_children'), required=False)

nr_network_device_groups_children_children:
  name: str()
  description: str(required=False)
  children: list(include('nr_network_device_groups_children_children_children'), required=False)

nr_network_device_groups_children_children_children:
  name: str()
  description: str(required=False)
  children: list(include('nr_network_device_groups_children_children_children_children'), required=False)

nr_network_device_groups_children_children_children_children:
  name: str()
  description: str(required=False)
  children: list(include('nr_network_device_groups_children_children_children_children_children'), required=False)

nr_network_device_groups_children_children_children_children_children:
  name: str()
  description: str(required=False)

nr_network_devices:
  name: regex('^[\w\d_\-\.]+$')
  description: str(required=False)
  ips: list(include('nr_network_devices_ips'), required=False)
  profile_name: str(required=False)
  model_name: str(required=False)
  software_version: str(required=False)
  network_device_groups: list(str(), required=False)
  authentication_network_protocol: enum('RADIUS', 'TACACS_PLUS', required=False)
  radius: include('nr_network_devices_radius', required=False)
  tacacs: include('nr_network_devices_tacacs', required=False)
  snmp: include('nr_network_devices_snmp', required=False)
  trust_sec: include('nr_network_devices_trust_sec', required=False)

nr_network_devices_ips:
  ip: str()
  ip_exclude: str(required=False)
  mask: int(min=0, max=128, required=False)

nr_network_devices_radius:
  shared_secret: str(required=False)
  second_shared_secret: str(required=False)
  coa_port: int(min=1, max=65535, required=False)
  dtls_required: bool(required=False)
  dtls_dns_name: str(required=False)
  enable_key_wrap: bool(required=False)
  encryption_key: str(required=False)
  encryption_key_format: enum('ASCII', 'HEXADECIMAL', required=False)
  message_authenticator_code_key: str(required=False)

nr_network_devices_tacacs:
  connect_mode_options: enum('OFF', 'ON_LEGACY', 'ON_DRAFT_COMPLIANT', required=False)
  shared_secret: str(required=False)

nr_network_devices_snmp:
  link_trap_query: bool(required=False)
  mac_trap_query: bool(required=False)
  originating_policy_services_node: str(required=False)
  polling_interval: any(int(min=600, max=86400), int(min=0, max=0), required=False)
  ro_community: str(required=False)
  version: enum('ONE', 'TWO_C', 'THREE', required=False)

nr_network_devices_trust_sec:
  device_id: str(required=False)
  device_password: str(required=False)
  rest_api_username: str(required=False)
  rest_api_password: str(required=False)
  download_environment_data_every_x_seconds: int(min=0, required=False)
  download_peer_authorization_policy_every_x_seconds: int(min=0, required=False)
  re_authentication_every_x_seconds: int(min=0, required=False)
  download_sgacl_lists_every_x_seconds: int(min=0, required=False)
  other_sga_devices_to_trust_this_device: bool(required=False)
  send_configuration_to_device: bool(required=False)
  send_configuration_to_device_using: enum('ENABLE_USING_COA', 'ENABLE_USING_CLI', 'DISABLE_ALL', required=False)
  coa_source_host: str(required=False)
  include_when_deploying_sgt_updates: bool(required=False)
  exec_mode_username: str(required=False)
  exec_mode_password: str(required=False)
  enable_mode_password: str(required=False)

identity_management:
  endpoints: list(include('im_endpoints'), required=False)
  endpoint_identity_groups: list(include('im_endpoint_identity_groups'), required=False)
  user_identity_groups: list(include('im_user_identity_groups'), required=False)
  internal_users: list(include('im_internal_users'), required=False)
  certificate_authentication_profiles: list(include('im_certificate_authentication_profiles'), required=False)
  active_directories: list(include('im_active_directories'), required=False)
  identity_source_sequences: list(include('im_identity_source_sequences'), required=False)

im_endpoints:
  mac: regex('^([0-9A-Fa-f]{2}:){5}([0-9A-Fa-f]{2})$')
  description: str(required=False)
  identity_store: str(required=False)
  identity_store_id: str(required=False)
  endpoint_identity_group: str(required=False)
  static_profile_assignment: bool()
  static_profile_assignment_defined: bool(required=False)
  static_group_assignment: bool()
  static_group_assignment_defined: bool(required=False)
  portal_user: str(required=False)
  profile_id: str(required=False)
  mdm_attributes: include('im_endpoints_mdm_attributes', required=False)
  custom_attributes: map(required=False)

im_endpoints_mdm_attributes:
  compliance_status: bool(required=False)
  encrypted: bool(required=False)
  enrolled: bool(required=False)
  imei: str(required=False)
  jail_broken: bool(required=False)
  manufacturer: str(required=False)
  model: str(required=False)
  os: str(required=False)
  phone_number: str(required=False)
  pin_lock: bool(required=False)
  reachable: bool(required=False)
  serial: str(required=False)
  server_name: str(required=False)

im_endpoint_identity_groups:
  name: regex('^[\w\d_\-\.]+$')
  description: str(required=False)
  parent_group: str(required=False)
  children: list(include('im_endpoint_identity_groups_children'), required=False)

im_endpoint_identity_groups_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_endpoint_identity_groups_children_children'), required=False)

im_endpoint_identity_groups_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_endpoint_identity_groups_children_children_children'), required=False)

im_endpoint_identity_groups_children_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_endpoint_identity_groups_children_children_children_children'), required=False)

im_endpoint_identity_groups_children_children_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_endpoint_identity_groups_children_children_children_children_children'), required=False)

im_endpoint_identity_groups_children_children_children_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)

im_user_identity_groups:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  parent_group: str(required=False)
  children: list(include('im_user_identity_groups_children'), required=False)

im_user_identity_groups_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_user_identity_groups_children_children'), required=False)

im_user_identity_groups_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_user_identity_groups_children_children_children'), required=False)

im_user_identity_groups_children_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_user_identity_groups_children_children_children_children'), required=False)

im_user_identity_groups_children_children_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  children: list(include('im_user_identity_groups_children_children_children_children_children'), required=False)

im_user_identity_groups_children_children_children_children_children:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)

im_internal_users:
  name: regex('^[\w\d_\-\.]+$')
  description: str(required=False)
  enabled: bool(required=False)
  email: str(required=False)
  account_name_alias: str(required=False)
  password: str()
  enable_password: str(required=False)
  first_name: str(required=False)
  last_name: str(required=False)
  change_password: bool(required=False)
  user_identity_groups: list(str(), required=False)
  password_never_expires: bool(required=False)
  password_id_store: str(required=False)

im_certificate_authentication_profiles:
  name: regex('^[\w\d_\-\.]+$')
  description: str(required=False)
  allowed_as_user_name: bool(required=False)
  match_mode: enum('NEVER', 'RESOLVE_IDENTITY_AMBIGUITY', 'BINARY_COMPARISON', required=False)
  username_from: enum('CERTIFICATE', 'UPN', required=False)
  certificate_attribute_name: enum('ALL_SUBJECT_AND_ALTERNATIVE_NAMES', 'SUBJECT_COMMON_NAME', 'SUBJECT_ALTERNATIVE_NAME', 'SUBJECT_SERIAL_NUMBER', 'SUBJECT', 'SUBJECT_ALTERNATIVE_NAME_OTHER_NAME', 'SUBJECT_ALTERNATIVE_NAME_EMAIL', 'SUBJECT_ALTERNATIVE_NAME_DNS', required=False)
  external_identity_store_name: str(required=False)

im_active_directories:
  name: regex('^[\w\d_\-\.]+$')
  description: str(required=False)
  domain: str()
  join_domain: bool(required=False)
  ad_scopes_names: str(required=False)
  ad_username: str(required=False)
  ad_password: str(required=False)
  enable_domain_allowed_list: bool(required=False)
  groups: list(include('im_active_directories_groups'), required=False)
  attributes: list(include('im_active_directories_attributes'), required=False)
  rewrite_rules: list(include('im_active_directories_rewrite_rules'), required=False)
  enable_rewrites: bool(required=False)
  enable_pass_change: bool(required=False)
  enable_machine_auth: bool(required=False)
  enable_machine_access: bool(required=False)
  enable_dialin_permission_check: bool(required=False)
  plaintext_auth: bool(required=False)
  aging_time: int(min=1, max=8760, required=False)
  enable_callback_for_dialin_client: bool(required=False)
  identity_not_in_ad_behaviour: enum('REJECT', 'SEARCH_JOINED_FOREST', 'SEARCH_ALL', required=False)
  unreachable_domains_behaviour: enum('PROCEED', 'DROP', required=False)
  schema: enum('ACTIVE_DIRECTORY', 'CUSTOM', required=False)
  first_name: str(required=False)
  department: str(required=False)
  last_name: str(required=False)
  organizational_unit: str(required=False)
  job_title: str(required=False)
  locality: str(required=False)
  email: str(required=False)
  state_or_province: str(required=False)
  telephone: str(required=False)
  country: str(required=False)
  street_address: str(required=False)
  enable_failed_auth_protection: bool(required=False)
  failed_auth_threshold: int(min=1, required=False)
  auth_protection_type: enum('WIRELESS', 'WIRED', 'BOTH', required=False)

im_active_directories_attributes:
  name: regex('^[\w\d_\-\.]+$')
  type: enum('STRING', 'IP', 'BOOLEAN', 'INT', 'OCTET_STRING')
  internal_name: str()
  default_value: str(required=False)

im_active_directories_rewrite_rules:
  row_id: int()
  rewrite_match: str()
  rewrite_result: str()

im_active_directories_groups:
  name: str()
  sid: str(required=False)
  type: enum('BUILTIN', 'DOMAIN LOCAL', 'GLOBAL', 'UNIVERSAL', required=False)

im_identity_source_sequences:
  name: regex('^[\w\d_\.]+$')
  description: str(required=False)
  certificate_authentication_profile: str(required=False)
  break_on_store_fail: bool()
  identity_sources: list(str())

trust_sec:
  push_mode: enum('AUTO', 'DISABLED', required=False)
  security_groups: list(include('ts_security_groups'), required=False)
  security_group_acls: list(include('ts_security_group_acls'), required=False)
  ip_sgt_mapping_groups: list(include('ts_ip_sgt_mapping_groups'), required=False)
  ip_sgt_mappings: list(include('ts_ip_sgt_mappings'), required=False)
  matrix_entries: list(include('ts_matrix_entries'), required=False)

ts_security_groups:
  name: regex('^[\w\d_\-\.]+$')
  description: str(required=False)
  propagate_to_apic: bool(required=False)
  value: int(min=-1, max=65519)

ts_security_group_acls:
  name: regex('^[\w\d_\-\.]+$')
  description: str(required=False)
  ip_version: enum('IPV4', 'IPV6', 'IP_AGNOSTIC', required=False)
  acl_content: str()

ts_ip_sgt_mapping_groups:
  name: regex('^[\w\d_\-\.]+$')
  sgt: str()
  deploy_type: enum('ALL', 'ND', 'NDG', required=False)
  deploy_to: str(required=False)

ts_ip_sgt_mappings:
  name: str(required=False)
  host_ip: ip(required=False)
  host_name: str(required=False)
  sgt: str(required=False)
  mapping_group: str(required=False)
  deploy_type: enum('ALL', 'ND', 'NDG', required=False)
  deploy_to: str(required=False)

ts_matrix_entries:
  source_sgt: str()
  destination_sgt: str()
  rule_status: enum('DISABLED', 'ENABLED', 'MONITOR', required=False)
  sgacl_name: str()

network_access:
  policy_elements: include('na_policy_elements', required=False)
  policy_sets: list(include('na_policy_sets'), required=False)
  authorization_global_exception_rules: list(include('na_policy_sets_authorization_rules'), required=False)

na_policy_elements:
  authorization_profiles: list(include('na_policy_elements_authorization_profiles'), required=False)
  conditions: list(include('na_policy_elements_conditions'), required=False)
  allowed_protocols: list(include('na_policy_elements_allowed_protocols'), required=False)
  downloadable_acls: list(include('na_policy_elements_downloadable_acls'), required=False)
  dictionaries: list(include('na_policy_elements_dictionaries'), required=False)
  time_date_conditions: list(include('na_policy_elements_time_date_conditions'), required=False)

na_policy_elements_authorization_profiles:
  name: regex('^[\w\d_\-\. ]+$')
  description: str(required=False)
  vlan_name_id: str(required=False)
  vlan_tag_id: int(min=0, max=31, required=False)
  web_redirection: include('na_policy_elements_authorization_profiles_web_redirection', required=False)
  agentless_posture: bool(required=False)
  access_type: enum('ACCESS_ACCEPT', 'ACCESS_REJECT', required=False)
  profile_name: str(required=False)
  airespace_acl: str(required=False)
  airespace_ipv6_acl: str(required=False)
  acl: str(required=False)
  dacl_name: str(required=False)
  ipv6_dacl_name: str(required=False)
  auto_smart_port: str(required=False)
  interface_template: str(required=False)
  ipv6_acl_filter: str(required=False)
  avc_profile: str(required=False)
  asa_vpn: str(required=False)
  unique_identifier: str(required=False)
  track_movement: bool(required=False)
  service_template: bool(required=False)
  easywired_session_candidate: bool(required=False)
  voice_domain_permission: bool(required=False)
  neat: bool(required=False)
  web_auth: bool(required=False)
  mac_sec_policy: enum('MUST_SECURE', 'MUST_NOT_SECURE', 'SHOULD_SECURE', required=False)
  reauthentication_connectivity: enum('DEFAULT', 'RADIUS_REQUEST', required=False)
  reauthentication_timer: int(min=1, max=65535, required=False)
  advanced_attributes: list(include('na_policy_elements_authorization_profiles_advanced_attributes'), required=False)

na_policy_elements_authorization_profiles_web_redirection:
  type: enum('CentralizedWebAuth', 'HotSpot', 'NativeSupplicanProvisioning', 'ClientProvisioning', required=False)
  acl: str(required=False)
  portal_name: str(required=False)
  static_ip_host_name_fqdn: str(required=False)
  display_certificates_renewal_messages: bool(required=False)

na_policy_elements_authorization_profiles_advanced_attributes:
  name: str()
  value: str()

na_policy_elements_conditions:
  name: regex('^[\w\d_\-\.]+$', required=False)
  type: enum('LibraryConditionAttributes', 'LibraryConditionAndBlock', 'LibraryConditionOrBlock')
  is_negate: bool(required=False)
  dictionary_name: str(required=False)
  attribute_name: str(required=False)
  operator: enum('contains', 'endsWith', 'equals', 'greaterOrEquals', 'greaterThan', 'in', 'ipEquals', 'ipGreaterThan', 'ipLessThan', 'ipNotEquals', 'lessOrEquals', 'lessThan', 'matches', 'notContains', 'notEndsWith', 'notEquals', 'notIn', 'notStartsWith', 'startsWith', 'macContains', 'macEndsWith', 'macEquals', 'macIn', 'macNotContains', 'macNotEndsWith', 'macNotEquals', 'macNotIn', 'macNotStartsWith', 'macStartsWith', required=False)
  attribute_value: str(required=False)
  description: str(required=False)
  children: list(include('na_policy_elements_conditions_children'), required=False)

na_policy_elements_conditions_children:
  name: regex('^[\w\d_\-\.]+$', required=False)
  type: enum('ConditionReference', 'ConditionAttributes', 'ConditionAndBlock', 'ConditionOrBlock')
  is_negate: bool(required=False)
  dictionary_name: str(required=False)
  attribute_name: str(required=False)
  operator: enum('contains', 'endsWith', 'equals', 'greaterOrEquals', 'greaterThan', 'in', 'ipEquals', 'ipGreaterThan', 'ipLessThan', 'ipNotEquals', 'lessOrEquals', 'lessThan', 'matches', 'notContains', 'notEndsWith', 'notEquals', 'notIn', 'notStartsWith', 'startsWith', 'macContains', 'macEndsWith', 'macEquals', 'macIn', 'macNotContains', 'macNotEndsWith', 'macNotEquals', 'macNotIn', 'macNotStartsWith', 'macStartsWith', required=False)
  attribute_value: str(required=False)
  description: str(required=False)
  children: list(include('na_policy_elements_conditions_children_children'), required=False)

na_policy_elements_conditions_children_children:
  name: regex('^[\w\d_\-\.]+$', required=False)
  type: enum('ConditionReference', 'ConditionAttributes')
  is_negate: bool(required=False)
  dictionary_name: str(required=False)
  attribute_name: str(required=False)
  operator: enum('contains', 'endsWith', 'equals', 'greaterOrEquals', 'greaterThan', 'in', 'ipEquals', 'ipGreaterThan', 'ipLessThan', 'ipNotEquals', 'lessOrEquals', 'lessThan', 'matches', 'notContains', 'notEndsWith', 'notEquals', 'notIn', 'notStartsWith', 'startsWith', 'macContains', 'macEndsWith', 'macEquals', 'macIn', 'macNotContains', 'macNotEndsWith', 'macNotEquals', 'macNotIn', 'macNotStartsWith', 'macStartsWith', required=False)
  attribute_value: str(required=False)
  description: str(required=False)

na_policy_elements_allowed_protocols:
  name: regex('^[\w\d\_\-\. ]+$')
  description: str(required=False)
  process_host_lookup: bool(required=False)
  allow_pap_ascii: bool(required=False)
  allow_chap: bool(required=False)
  allow_ms_chap_v1: bool(required=False)
  allow_ms_chap_v2: bool(required=False)
  allow_eap_md5: bool(required=False)
  allow_leap: bool(required=False)
  allow_eap_tls: bool(required=False)
  allow_eap_ttls: bool(required=False)
  allow_eap_fast: bool(required=False)
  allow_peap: bool(required=False)
  allow_teap: bool(required=False)
  allow_preferred_eap_protocol: bool(required=False)
  preferred_eap_protocol: enum('EAP_FAST', 'PEAP', 'LEAP', 'EAP_MD5', 'EAP_TLS', 'EAP_TTLS', 'TEAP', required=False)
  eap_tls_l_bit: bool(required=False)
  allow_weak_ciphers_for_eap: bool(required=False)
  require_message_auth: bool(required=False)
  five_g: bool(required=False)
  teap: include('na_policy_elements_allowed_protocols_teap', required=False)
  eap_ttls: include('na_policy_elements_allowed_protocols_eap_ttls', required=False)
  eap_tls: include('na_policy_elements_allowed_protocols_eap_tls', required=False)
  eap_fast: include('na_policy_elements_allowed_protocols_eap_fast', required=False)
  peap: include('na_policy_elements_allowed_protocols_peap', required=False)

na_policy_elements_allowed_protocols_teap:
  eap_ms_chap_v2: bool(required=False)
  eap_ms_chap_v2_pwd_change: bool(required=False)
  eap_ms_chap_v2_pwd_change_retries: int(min=0, max=3, required=False)
  eap_tls: bool(required=False)
  eap_tls_auth_of_expired_certs: bool(required=False)
  accept_client_cert_during_tunnel_est: bool(required=False)
  enable_eap_chaining: bool(required=False)
  allow_downgrade_msk: bool(required=False)
  request_basic_pwd_auth: bool(required=False)

na_policy_elements_allowed_protocols_eap_ttls:
  pap_ascii: bool(required=False)
  chap: bool(required=False)
  ms_chap_v1: bool(required=False)
  ms_chap_v2: bool(required=False)
  eap_md5: bool(required=False)
  eap_ms_chap_v2: bool(required=False)
  eap_ms_chap_v2_pwd_change: bool(required=False)
  eap_ms_chap_v2_pwd_change_retries: int(min=0, max=3, required=False)

na_policy_elements_allowed_protocols_eap_tls:
  auth_of_expired_certs: bool(required=False)
  enable_stateless_session_resume: bool(required=False)
  session_ticket_ttl: int(min=1, required=False)
  session_ticket_ttl_unit: enum('SECONDS' 'MINUTES', 'HOURS', 'DAYS', 'WEEKS', required=False)
  session_ticket_percentage: int(min=1, max=100, required=False)

na_policy_elements_allowed_protocols_eap_fast:
  eap_ms_chap_v2: bool(required=False)
  eap_ms_chap_v2_pwd_change: bool(required=False)
  eap_ms_chap_v2_pwd_change_retries: int(min=0, max=3, required=False)
  eap_gtc: bool(required=False)
  eap_gtc_pwd_change: bool(required=False)
  eap_gtc_pwd_change_retries: int(min=0, max=3, required=False)
  eap_tls: bool(required=False)
  eap_tls_auth_of_expired_certs: bool(required=False)
  use_pacs: bool(required=False)
  use_pacs_tunnel_pac_ttl: int(min=1, max=10000, required=False)
  use_pacs_tunnel_pac_ttl_units: enum('SECONDS' 'MINUTES', 'HOURS', 'DAYS', 'WEEKS', required=False)
  use_pacs_use_proactive_pac_update_precentage: int(min=1, max=100, required=False)
  use_pacs_allow_anonym_provisioning: bool(required=False)
  use_pacs_allow_authen_provisioning: bool(required=False)
  use_pacs_accept_client_cert: bool(required=False)
  use_pacs_server_returns: bool(required=False)
