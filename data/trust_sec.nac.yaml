---
# TrustSec data plane policy for the LTRXAR-3100 multi-domain demo.
# See multi-domain/design.md §6 for end-to-end design across the three planes
# (classification, propagation, enforcement) and §7 for the policy matrix.
ise:
  trust_sec:
    security_groups:
      - name: IT_Admin
        description: Internal user endpoints (laptops, workstations)
        value: 40
      - name: Servers
        description: Production servers
        value: 20
      - name: Cameras
        description: IoT cameras and surveillance devices
        value: 30

    security_group_acls:
      - name: PERMIT_ANY
        description: Permit all IP traffic between SGTs
        ip_version: IP_AGNOSTIC
        acl_content: |
          permit ip
      - name: PERMIT_CAMERA_STREAM
        description: Allow IT_Admins to view camera streams (RTSP + HTTP)
        ip_version: IPV4
        acl_content: |
          permit tcp dst eq 554
          permit tcp dst eq 8080
          deny ip
      - name: DENY_IP_LOG
        description: Deny everything and log (headline drop SGACL)
        ip_version: IP_AGNOSTIC
        acl_content: |
          deny ip log

    ip_sgt_mappings:
      - name: laptop
        host_name: laptop
        host_ip: 192.168.100.10
        sgt: IT_Admin
        deploy_type: ALL
      - name: server
        host_name: server
        host_ip: 192.168.110.10
        sgt: Servers
        deploy_type: ALL
      - name: camera
        host_name: camera
        host_ip: 192.168.200.10
        sgt: Cameras
        deploy_type: ALL

    matrix_entries:
      # ── Permit beats ──
      - source_sgt: IT_Admin
        destination_sgt: Servers
        sgacl_name: PERMIT_ANY
        rule_status: ENABLED
      - source_sgt: IT_Admin
        destination_sgt: Cameras
        sgacl_name: PERMIT_CAMERA_STREAM
        rule_status: ENABLED
      # ── Deny beats — the headline ──
      - source_sgt: Cameras
        destination_sgt: Servers
        sgacl_name: DENY_IP_LOG
        rule_status: ENABLED
      - source_sgt: Cameras
        destination_sgt: IT_Admin
        sgacl_name: DENY_IP_LOG
        rule_status: ENABLED
