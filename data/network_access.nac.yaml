---
# Wired access policy for endpoint connectivity.
#
# SGT assignment for endpoints in this lab is driven entirely by static
# IP-SGT mappings in trust_sec.nac.yaml. This policy_set keeps the protocol-level wired access plumbing in
# place (so endpoints can attach to SDA edge ports configured with
# "No Authentication"); the authz layer just permits authenticated traffic
# without dynamically assigning an SGT.
#
# In production, the dot1x → ISE authz rule path would carry SGT assignment
# in the RADIUS Accept (Cisco AV-pair cts:security-group-tag). CML stub
# endpoints have no real supplicant, so it would never fire.
ise:
  network_access:
    policy_sets:
      - name: Wired Access Policy Set
        description: Wired Access
        condition:
          type: ConditionAttributes
          dictionary_name: DEVICE
          attribute_name: Location
          operator: equals
          attribute_value: All Locations
        service_name: Default Network Access
        authentication_rules:
          - name: DOT1x_wired
            state: enabled
            condition:
              type: ConditionAndBlock
              children:
                - type: ConditionAttributes
                  dictionary_name: CERTIFICATE
                  attribute_name: Subject - Common Name
                  operator: contains
                  attribute_value: Workstation
                - type: ConditionReference
                  name: Wired_802.1X
            identity_source_name: Preloaded_Certificate_Profile
            if_auth_fail: REJECT
            if_user_not_found: CONTINUE
            if_process_fail: DROP
          - name: MAB_wired
            condition:
              type: ConditionReference
              name: Wired_MAB
            identity_source_name: Internal Endpoints
            if_auth_fail: REJECT
            if_user_not_found: CONTINUE
            if_process_fail: DROP
        authorization_rules:
          - name: Basic_Authenticated_Access
            condition:
              type: ConditionReference
              name: Network_Access_Authentication_Passed
            profiles:
              - PermitAccess
          - name: Default
            state: enabled
            profiles:
              - DenyAccess
