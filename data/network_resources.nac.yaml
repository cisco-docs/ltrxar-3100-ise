---
# Network Access Devices (NADs) for the LTRXAR-3100 multi-domain demo.
#
# Each SDA device authenticates to ISE for CTS PAC provisioning and downloads
# the SGT name table, IP-SGT bindings, and the SGACL matrix. Without these
# entries, no fabric device can classify or enforce TrustSec policy.
# See multidomain/design.md §6.3.
#
# Credentials (single shared value for lab simplicity — DO NOT REUSE IN PROD):
#   radius.shared_secret      → must match the device's `radius server / key`
#   trust_sec.device_password → must match the device's `cts credentials password`
#
# rest_api_username/password are deliberately omitted: we use
# `send_configuration_to_device_using: ENABLE_USING_COA`, which pushes matrix
# updates via RADIUS CoA — REST API to the device is not used.
#
# Short download intervals (60s) are deliberate so that the Beat 4 demo
# (matrix toggle) takes effect within the demo window.
#
# C-EDGE-01 and C-EDGE-02 are intentionally NOT registered as NADs — they
# run pure CTS inline tagging (sgt_propagation + sgt_trusted), so they
# trust SDA's classification and propagate the tag without needing PAC,
# IP-SGT cache, or SGACL matrix locally. See bottom of file.
ise:
  network_resources:
    network_devices:
      - name: SDA-BORDER
        description: SDA Fabric A border + control plane node
        ips:
          - ip: 198.18.140.31
        radius:
          shared_secret: C1sco12345
        trust_sec:
          device_id: SDA-BORDER
          device_password: C1sco12345
          download_environment_data_every_x_seconds: 60
          download_sgacl_lists_every_x_seconds: 60
          send_configuration_to_device: true
          send_configuration_to_device_using: ENABLE_USING_COA

      - name: SDA-FIAB
        description: SDA Fabric B fabric-in-a-box (border + control plane + edge)
        ips:
          - ip: 198.18.140.34
        radius:
          shared_secret: C1sco12345
        trust_sec:
          device_id: SDA-FIAB
          device_password: C1sco12345
          download_environment_data_every_x_seconds: 60
          download_sgacl_lists_every_x_seconds: 60
          send_configuration_to_device: true
          send_configuration_to_device_using: ENABLE_USING_COA

      - name: SDA-EDGE-01
        description: SDA Fabric A edge node (hosts laptop)
        ips:
          - ip: 198.18.140.32
        radius:
          shared_secret: C1sco12345
        trust_sec:
          device_id: SDA-EDGE-01
          device_password: C1sco12345
          download_environment_data_every_x_seconds: 60
          download_sgacl_lists_every_x_seconds: 60
          send_configuration_to_device: true
          send_configuration_to_device_using: ENABLE_USING_COA

      - name: SDA-EDGE-02
        description: SDA Fabric A edge node (hosts server) — primary enforcement point for headline drop
        ips:
          - ip: 198.18.140.33
        radius:
          shared_secret: C1sco12345
        trust_sec:
          device_id: SDA-EDGE-02
          device_password: C1sco12345
          download_environment_data_every_x_seconds: 60
          download_sgacl_lists_every_x_seconds: 60
          send_configuration_to_device: true
          send_configuration_to_device_using: ENABLE_USING_COA

      # ─────────────────────────────────────────────────────────────────────
      # C-EDGE-01 and C-EDGE-02 are intentionally NOT registered as NADs.
      # They run pure CTS inline tagging (sgt_propagation + sgt_trusted) on
      # the LAN handoff — they trust SDA's classification and propagate the
      # SGT across the SD-WAN overlay, but neither classify nor enforce.
      # No need for ISE PAC, IP-SGT bindings, or SGACL matrix on the cEdges.
      # The headline drop (Cameras → Servers/Employees) is enforced at
      # SDA-EDGE-02. If cEdge enforcement is added later, register them here.
      # ─────────────────────────────────────────────────────────────────────
