                - type: ConditionOrBlock
                  is_negate: true
                  children:
                    - type: ConditionAttributes
                      is_negate: false
                      dictionary_name: Radius
                      attribute_name: User-Name
                      operator: equals
                      attribute_value: User1
                    - type: ConditionReference
                      is_negate: false
                      name: 5G
                - type: ConditionReference
                  is_negate: false
                  name: 5G
            identity_source_name: Internal Users
            if_auth_fail: REJECT
            if_user_not_found: CONTINUE
            if_process_fail: DROP
          - name: Default
        authorization_rules:
          - name: MIN_AUTHZ
            condition:
              type: ConditionReference
              name: 5G
            profiles: [MIN_AP]
          - name: MIN_AUTHZ_2
            condition:
              type: ConditionReference
              name: 5G
            profiles: [MIN_AP]
          - name: MAX_AUTHZ
            state: disabled
            condition:
              type: ConditionAndBlock
              is_negate: false
              children:
                - type: ConditionOrBlock
                  is_negate: true
