                      operator: equals
                      attribute_value: User1
                    - type: ConditionReference
                      is_negate: false
                      name: 5G
                - type: ConditionReference
                  is_negate: false
                  name: 5G
            identity_source_name: Internal Users
            if_auth_fail: REJECT
            if_user_not_found: CONTINUE
            if_process_fail: DROP
          - name: Default
        authorization_rules:
          - name: MIN_AUTHZ
